        // === Clipboard ========================================================

        let clipboardText = "";
        let clipboardNote = "";
        let clipboardBusy = false;
        let clipboardDraft = "";

        async function fetchClipboard() {
            if (clipboardBusy) return;
            clipboardBusy = true;
            renderClipboardStatus();
            try {
                const resp = await fetch(`${API_BASE}/clipboard`, {headers: getHeaders()});
                const data = await resp.json();
                if (!data.ok) {
                    clipboardNote = data.message || "Could not read the clipboard";
                } else {
                    clipboardText = data.text || "";
                    clipboardDraft = clipboardText;
                    clipboardNote = data.message ||
                        (clipboardText ? "" : "The PC clipboard is empty.");
                    const box = document.getElementById("clipBox");
                    if (box) box.value = clipboardDraft;
                }
            } catch (e) {
                clipboardNote = "Connection error";
            } finally {
                clipboardBusy = false;
                renderClipboardStatus();
            }
        }

        // The same rule the PC applies, so the button appears exactly when the
        // request would succeed: an http(s) URL, or a bare host that cannot be
        // anything else.
        function looksLikeLink(text) {
            const candidate = (text || "").trim();
            if (!candidate || /[\s\u0000-\u001f]/.test(candidate)) return false;
            if (candidate.includes("://")) return /^https?:\/\/[^/]+/i.test(candidate);
            return /^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9-]+)+(:\d+)?([/?#].*)?$/i.test(candidate);
        }

        async function openOnPC(text) {
            const box = document.getElementById("clipBox");
            const url = (text !== undefined ? text : (box ? box.value : clipboardDraft)).trim();
            if (!looksLikeLink(url)) { showError("That is not a link"); return; }
            try {
                const resp = await fetch(`${API_BASE}/open`, {
                    method: "POST", headers: getHeaders(), body: JSON.stringify({url}),
                });
                const data = await resp.json();
                if (data.ok) {
                    buzz(6);
                    clipboardNote = data.message || "Opened on the PC";
                } else {
                    showError(data.message || "Could not open it");
                }
                renderClipboardStatus();
            } catch (e) {
                showError("Connection error");
            }
        }

        async function pushClipboard() {
            const box = document.getElementById("clipBox");
            const text = box ? box.value : clipboardDraft;
            if (!text.trim()) { showError("Nothing to send"); return; }
            clipboardBusy = true;
            renderClipboardStatus();
            try {
                const resp = await fetch(`${API_BASE}/clipboard`, {
                    method: "POST", headers: getHeaders(), body: JSON.stringify({text}),
                });
                const data = await resp.json();
                clipboardNote = data.message || "";
                if (data.ok) { buzz(8); showNotice(data.message || "Copied to the PC"); }
                else showError(data.message || "Could not set the clipboard");
            } catch (e) {
                showError("Connection error");
            } finally {
                clipboardBusy = false;
                renderClipboardStatus();
            }
        }

        // navigator.clipboard needs a secure context, which http://<lan-ip> is
        // not. Selecting the text is the honest fallback: the phone's own copy
        // gesture then works, and nothing pretends to have copied.
        async function copyToPhone() {
            const box = document.getElementById("clipBox");
            if (!box) return;
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(box.value);
                    showNotice("Copied to this phone");
                    return;
                }
            } catch (e) {}
            box.focus();
            box.select();
            showNotice("Selected — use your phone's Copy");
        }

        function renderClipboardStatus() {
            const el = document.getElementById("clipStatus");
            if (el) el.textContent = clipboardBusy ? "Working…" : clipboardNote;
            const buttons = document.querySelectorAll("#clipActions button");
            buttons.forEach(b => { b.disabled = clipboardBusy; });
        }

        // === Clipboard history ===============================================
        // Memory only, on the PC, and started by opening this screen. It is
        // offered because "send me that" is nearly always followed by "and the
        // one before it" -- and cleared with one button, because a clipboard
        // sometimes holds a password.
        let clipHistory = [];
        let clipHistoryError = "";

        async function fetchClipHistory() {
            try {
                const resp = await fetch(`${API_BASE}/clipboard/history`, {headers: getHeaders()});
                const data = await resp.json();
                clipHistory = data.entries || [];
                clipHistoryError = data.error || "";
            } catch (e) {
                clipHistoryError = "Connection error";
            }
            paintClipHistory();
        }

        async function clearClipHistory() {
            try {
                await fetch(`${API_BASE}/clipboard/history`, {
                    method: "DELETE", headers: getHeaders(),
                });
                clipHistory = [];
                buzz(6);
            } catch (e) {
                showError("Connection error");
            }
            paintClipHistory();
        }

        function useClip(seq) {
            const entry = clipHistory.find(e => String(e.seq) === String(seq));
            if (!entry) return;
            clipboardDraft = entry.text;
            renderClipboard(document.getElementById("content"));
        }

        function paintClipHistory() {
            const el = document.getElementById("clipHistory");
            if (!el) return;
            if (clipHistoryError) {
                el.innerHTML = `<div class="empty">${escapeHtml(clipHistoryError)}</div>`;
                return;
            }
            if (!clipHistory.length) {
                el.innerHTML = '<div class="empty">Nothing yet. What gets copied on the PC ' +
                    'from now on shows up here, and only in memory.</div>';
                return;
            }
            el.innerHTML = '<div class="card">' + clipHistory.map(entry => rowHtml({
                icon: "📋",
                title: clipPreview(entry.text),
                sub: relativeTime(entry.ts) + (entry.truncated ? " · shortened" : ""),
                clip: entry.seq,
                wrap: true,
            })).join("") + '</div>';
        }

        function clipPreview(text) {
            const oneLine = (text || "").replace(/\s+/g, " ").trim();
            return oneLine.length > 80 ? oneLine.slice(0, 79) + "…" : oneLine;
        }

        function renderClipboard(el) {
            let html = sectionHtml("PC clipboard",
                `<textarea class="box" id="clipBox" placeholder="Text to send to the PC clipboard"` +
                ` spellcheck="false">${escapeHtml(clipboardDraft)}</textarea>` +
                '<div class="btnrow" id="clipActions">' +
                '<button id="clipGet">Get from PC</button>' +
                '<button id="clipCopy">Copy here</button>' +
                '<button class="primary" id="clipSend">Send to PC</button>' +
                '</div>' +
                // Only offered for something that is actually a link: a button
                // that would answer "that is not a link" is one nobody should
                // have been able to press.
                (looksLikeLink(clipboardDraft)
                    ? '<div class="btnrow"><button id="clipOpen">Open on the PC</button></div>'
                    : "") +
                '<div class="section-note" id="clipStatus"></div>');
            html += sectionHtml("Recently copied on the PC",
                '<div id="clipHistory"></div>' +
                '<div class="btnrow"><button id="clipHistoryClear">Forget these</button></div>',
                null, {note: "Kept in memory on the PC only, and only while it is running."});
            el.innerHTML = html;
            renderClipboardStatus();
            paintClipHistory();
            fetchClipHistory();
            if (!clipboardText && !clipboardNote) fetchClipboard();
        }

        // === What works =======================================================
        // `vt doctor` in the page, because the person debugging is holding the
        // phone and the PC is across the room. Every row is a read.
        const HEALTH_ICONS = {ok: "✓", warn: "⚠", info: "ℹ", fail: "✗"};
        let healthChecks = [];
        let healthSummary = "";
        let healthError = "";

        async function fetchHealth() {
            try {
                const resp = await fetch(`${API_BASE}/diagnostics`, {headers: getHeaders()});
                const data = await resp.json();
                healthChecks = data.checks || [];
                healthSummary = data.summary || "";
                healthError = "";
            } catch (e) {
                healthError = "Connection error";
            }
            paintHealth();
        }

        function paintHealth() {
            const el = document.getElementById("healthList");
            if (!el) return;
            if (healthError) {
                el.innerHTML = `<div class="empty">${escapeHtml(healthError)}</div>`;
                return;
            }
            if (!healthChecks.length) {
                el.innerHTML = '<div class="empty">Checking…</div>';
                return;
            }
            el.innerHTML = '<div class="card">' + healthChecks.map(check => rowHtml({
                icon: HEALTH_ICONS[check.state] || "•",
                title: check.title,
                // Everything the row knows, in the order someone reads it:
                // what is true, what it costs, what to do about it.
                sub: [check.detail,
                      check.lost ? "without it: " + check.lost : "",
                      check.fix ? "fix: " + check.fix : ""].filter(Boolean).join(" · "),
                wrap: true,
            })).join("") + '</div>';
        }

        function renderHealth(el) {
            el.innerHTML = sectionHtml("What works",
                '<div id="healthList"></div>' +
                '<div class="btnrow"><button id="healthRefresh">Check again</button></div>',
                null, {note: healthSummary});
            paintHealth();
            fetchHealth();
        }

        // === Notifications ====================================================

        let notifs = [];
        let notifSeq = 0;
        let notifError = "";
        let notifMuted = [];
        let notifTimer = null;

        async function fetchNotifications() {
            try {
                const resp = await fetch(`${API_BASE}/notifications?since=${notifSeq}`, {headers: getHeaders()});
                const data = await resp.json();
                notifError = data.error || "";
                notifMuted = data.muted || [];
                const fresh = data.entries || [];
                if (fresh.length) {
                    fresh.forEach(entry => { notifSeq = Math.max(notifSeq, entry.seq); });
                    // Newest first, and bounded: this list is a glance, not an
                    // archive.
                    notifs = fresh.reverse().concat(notifs).slice(0, 60);
                }
                renderNotifList();
            } catch (e) {
                notifError = "Connection error";
                renderNotifList();
            }
        }

        function receiveNotifications(entries) {
            // Pushed over the socket rather than found by the next poll. The
            // list is the same one the poll fills, so a screen opened later
            // shows what arrived while it was closed.
            const fresh = entries.filter(e => e && e.seq > notifSeq);
            if (!fresh.length) return;
            fresh.forEach(entry => { notifSeq = Math.max(notifSeq, entry.seq); });
            notifs = fresh.reverse().concat(notifs).slice(0, 60);
            notifError = "";
            renderNotifList();
        }

        function startNotifPoll() {
            stopNotifPoll();
            fetchNotifications();
            notifTimer = setInterval(() => {
                // The screen owns the poll: leaving it must not leave a timer
                // behind hitting the PC every three seconds forever.
                if (!isNotifView()) { stopNotifPoll(); return; }
                // With the socket up the server pushes each notification as it
                // arrives, so this is only here to catch one that was missed
                // while the socket was down.
                if (ws && ws.readyState === WebSocket.OPEN) return;
                fetchNotifications();
            }, 3000);
        }

        function stopNotifPoll() {
            if (notifTimer) clearInterval(notifTimer);
            notifTimer = null;
        }

        function renderNotifList() {
            const el = document.getElementById("notifList");
            if (!el) return;
            if (notifError) {
                el.innerHTML = `<div class="empty">${escapeHtml(notifError)}</div>`;
                return;
            }
            if (!notifs.length) {
                el.innerHTML = '<div class="empty">Nothing yet. Notifications that arrive on the PC from now on show up here.</div>';
                return;
            }
            el.innerHTML = '<div class="card">' + notifs.map(n => rowHtml({
                icon: "🔔",
                title: n.summary || n.app,
                sub: [n.app, n.body].filter(Boolean).join(" · "),
                meta: n.id ? "" : relativeTime(n.ts),
                // No id means the daemon's reply was never seen, and closing it
                // would fail. No button beats a button that lies.
                dismiss: n.id || 0,
                mute: n.app || "",
                wrap: true,
            })).join("") + '</div>' + mutedHtml();
        }

        function mutedHtml() {
            if (!notifMuted.length) return "";
            const rows = notifMuted.map(app => rowHtml({
                icon: "🔕",
                title: app,
                sub: "muted for now",
                unmute: app,
            })).join("");
            return sectionHtml("Muted", `<div class="card">${rows}</div>`, null,
                {note: "Until the PC's server restarts."});
        }

        async function muteApp(app, muted) {
            try {
                const resp = await fetch(`${API_BASE}/notifications/mute`, {
                    method: "POST", headers: getHeaders(),
                    body: JSON.stringify({app: app, muted: muted}),
                });
                const data = await resp.json();
                if (!data.ok) { showError(data.message || "Could not do that"); return; }
                buzz(6);
                notifMuted = data.muted || [];
                if (muted) notifs = notifs.filter(n => n.app !== app);
                renderNotifList();
            } catch (e) {
                showError("Connection error");
            }
        }

        async function dismissNotification(id) {
            try {
                const resp = await fetch(`${API_BASE}/notifications/dismiss`, {
                    method: "POST", headers: getHeaders(), body: JSON.stringify({id: Number(id)}),
                });
                const data = await resp.json();
                if (data.ok) {
                    buzz(6);
                    notifs = notifs.filter(n => String(n.id) !== String(id));
                    renderNotifList();
                } else {
                    showError(data.message || "Could not dismiss it");
                }
            } catch (e) {
                showError("Connection error");
            }
        }

        // === Push =============================================================
        // The only thing that reaches a phone whose page is closed. The
        // browser hands back a subscription; the PC keeps it and posts to it.
        let pushState = "unknown";   // unknown | unavailable | off | on | denied
        let pushNote = "";

        function pushSupported() {
            return "serviceWorker" in navigator && "PushManager" in window &&
                   typeof Notification !== "undefined";
        }

        async function fetchPushState() {
            if (!pushSupported()) { pushState = "unavailable"; pushNote = "This browser cannot do push."; return; }
            try {
                const resp = await fetch(`${API_BASE}/push/key`, {headers: getHeaders()});
                const data = await resp.json();
                if (!data.available) {
                    pushState = "unavailable";
                    pushNote = data.message || "The PC cannot send push messages.";
                    return;
                }
                pushKey = data.key || "";
                const registration = await navigator.serviceWorker.ready;
                const existing = await registration.pushManager.getSubscription();
                pushState = existing && data.subscribed ? "on" : "off";
                if (Notification.permission === "denied") pushState = "denied";
                pushNote = "";
            } catch (e) {
                pushState = "unknown";
                pushNote = "Could not ask the PC about push.";
            }
        }

        let pushKey = "";

        function keyBytes(base64url) {
            const padded = (base64url + "=".repeat((4 - base64url.length % 4) % 4))
                .replace(/-/g, "+").replace(/_/g, "/");
            const raw = atob(padded);
            return Uint8Array.from(raw, c => c.charCodeAt(0));
        }

        async function enablePush() {
            if (!pushSupported() || !pushKey) return;
            try {
                const permission = await Notification.requestPermission();
                if (permission !== "granted") {
                    pushState = permission === "denied" ? "denied" : "off";
                    pushNote = "The browser did not allow notifications.";
                    renderNotifications(document.getElementById("content"));
                    return;
                }
                const registration = await navigator.serviceWorker.ready;
                const subscription = await registration.pushManager.subscribe({
                    userVisibleOnly: true,
                    applicationServerKey: keyBytes(pushKey),
                });
                const resp = await fetch(`${API_BASE}/push/subscribe`, {
                    method: "POST", headers: getHeaders(),
                    body: JSON.stringify({subscription: subscription.toJSON()}),
                });
                const data = await resp.json();
                if (!data.ok) { showError(data.message || "The PC would not take it"); return; }
                pushState = "on";
                pushNote = "";
                buzz(6);
            } catch (e) {
                pushNote = "Could not turn push on: " + e;
            }
            renderNotifications(document.getElementById("content"));
        }

        async function disablePush() {
            try {
                const registration = await navigator.serviceWorker.ready;
                const existing = await registration.pushManager.getSubscription();
                const endpoint = existing ? existing.endpoint : "";
                if (existing) await existing.unsubscribe();
                await fetch(`${API_BASE}/push/unsubscribe`, {
                    method: "POST", headers: getHeaders(),
                    body: JSON.stringify({endpoint}),
                });
                pushState = "off";
                pushNote = "";
                buzz(6);
            } catch (e) {
                pushNote = "Could not turn push off: " + e;
            }
            renderNotifications(document.getElementById("content"));
        }

        function pushHtml() {
            if (pushState === "unavailable") {
                return sectionHtml("With the page closed",
                    `<div class="empty">${escapeHtml(pushNote || "Not available here.")}</div>`);
            }
            if (pushState === "denied") {
                return sectionHtml("With the page closed",
                    '<div class="empty">This browser has notifications blocked for this ' +
                    'page. Allow them in the site settings, then come back.</div>');
            }
            const on = pushState === "on";
            return sectionHtml("With the page closed",
                '<div class="btnrow">' +
                `<button class="${on ? "" : "primary"}" id="pushToggle">` +
                (on ? "Stop sending these" : "Send these to my phone") +
                '</button></div>' +
                (pushNote ? `<div class="section-note">${escapeHtml(pushNote)}</div>` : ""),
                null,
                {note: on
                    ? "Notifications arrive even when this page is shut."
                    : "Without this, notifications only arrive while this page is open."});
        }

        function renderNotifications(el) {
            el.innerHTML = sectionHtml("Recent",
                '<div id="notifList"></div>' +
                '<div class="btnrow"><button id="notifClear">Clear list</button></div>',
                null, {note: "Press and hold a notification to mute that app for now."}) +
                pushHtml();
            renderNotifList();
            startNotifPoll();
            if (pushState === "unknown") {
                fetchPushState().then(() => {
                    if (isNotifView()) renderNotifications(document.getElementById("content"));
                });
            }
        }

        // === File transfer ====================================================

        let filesList = null;
        let filesError = "";
        let filesDir = "";
        let uploadPct = -1;

        async function fetchFiles() {
            try {
                const resp = await fetch(`${API_BASE}/files`, {headers: getHeaders()});
                const data = await resp.json();
                filesList = data.files || [];
                filesDir = data.dir || "";
                filesError = "";
            } catch (e) {
                filesError = "Connection error";
            }
            renderFileList();
        }

        // XHR rather than fetch: a 40 MB photo over Wi-Fi needs a progress bar,
        // and fetch still cannot report upload progress.
        function uploadFile(file) {
            return new Promise((resolve) => {
                const form = new FormData();
                form.append("file", file, file.name);
                const xhr = new XMLHttpRequest();
                xhr.open("POST", `${API_BASE}/upload`);
                const headers = getHeaders();
                Object.keys(headers).forEach(name => {
                    // FormData sets its own multipart Content-Type, boundary and all.
                    if (name.toLowerCase() !== "content-type") xhr.setRequestHeader(name, headers[name]);
                });
                xhr.upload.addEventListener("progress", (ev) => {
                    if (!ev.lengthComputable) return;
                    uploadPct = Math.round((ev.loaded / ev.total) * 100);
                    renderUploadProgress();
                });
                xhr.addEventListener("load", () => {
                    let data = {};
                    try { data = JSON.parse(xhr.responseText); } catch (e) {}
                    if (data.ok) { buzz(10); showNotice(data.message || "Sent"); }
                    else showError(data.message || `Upload failed (${xhr.status})`);
                    resolve(data.ok === true);
                });
                xhr.addEventListener("error", () => { showError("Upload failed"); resolve(false); });
                xhr.send(form);
            });
        }

        async function uploadFiles(fileList) {
            for (const file of Array.from(fileList)) {
                uploadPct = 0;
                renderUploadProgress();
                await uploadFile(file);
            }
            uploadPct = -1;
            renderUploadProgress();
            fetchFiles();
        }

        // Fetched with the auth headers and handed to the browser as a blob: a
        // plain <a href> would need the credential in the URL, which is exactly
        // what the token capture page exists to keep out of history.
        async function downloadFile(name) {
            showNotice("Fetching…");
            try {
                const resp = await fetch(`${API_BASE}/files/${encodeURIComponent(name)}`, {headers: getHeaders()});
                if (!resp.ok) { showError(`Download failed (${resp.status})`); return; }
                const blob = await resp.blob();
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.href = url;
                link.download = name;
                document.body.appendChild(link);
                link.click();
                link.remove();
                setTimeout(() => URL.revokeObjectURL(url), 10000);
            } catch (e) {
                showError("Download failed");
            }
        }

        const openingFiles = new Set();
        async function openFileOnPc(name, btn) {
            if (openingFiles.has(name)) return;
            openingFiles.add(name);
            if (btn) {
                btn.disabled = true;
                btn.textContent = "Opening…";
            }
            try {
                const resp = await fetch(`${API_BASE}/files/open`, {
                    method: "POST", headers: getHeaders(), body: JSON.stringify({name}),
                });
                const data = await resp.json();
                if (data.ok) showNotice(data.message || "Opened");
                else showError(data.message || "Could not open it");
            } catch (e) {
                showError("Connection error");
            } finally {
                setTimeout(() => {
                    openingFiles.delete(name);
                    if (btn) {
                        btn.disabled = false;
                        btn.textContent = "Open on PC";
                    }
                }, 1200);
            }
        }

        function fmtSize(bytes) {
            const units = ["B", "KB", "MB", "GB"];
            let value = bytes, unit = 0;
            while (value >= 1024 && unit < units.length - 1) { value /= 1024; unit++; }
            return (unit === 0 ? value : value.toFixed(value >= 10 ? 0 : 1)) + " " + units[unit];
        }

        function renderUploadProgress() {
            const bar = document.getElementById("uploadBar");
            if (!bar) return;
            bar.classList.toggle("hidden", uploadPct < 0);
            const fill = bar.querySelector("span");
            if (fill) fill.style.width = Math.max(0, uploadPct) + "%";
        }

        function renderFileList() {
            const el = document.getElementById("fileList");
            if (!el) return;
            if (filesError) { el.innerHTML = `<div class="empty">${escapeHtml(filesError)}</div>`; return; }
            if (filesList === null) { el.innerHTML = '<div class="empty">Loading…</div>'; return; }
            if (!filesList.length) {
                el.innerHTML = '<div class="empty">No files yet. Anything you send lands in ' +
                    escapeHtml(filesDir || "the transfer folder") + '.</div>';
                return;
            }
            el.innerHTML = '<div class="card">' + filesList.map(f => rowHtml({
                icon: "📄",
                title: f.name,
                sub: fmtSize(f.size) + " · " + relativeTime(f.mtime),
            }) + '<div class="btnrow">' +
                `<button data-download="${escapeAttr(f.name)}">Save to phone</button>` +
                `<button data-openfile="${escapeAttr(f.name)}">Open on PC</button>` +
                // Offered only for pictures, because it is the only thing the
                // PC could do with anything else, which is nothing.
                (isPicture(f.name)
                    ? `<button data-wallpaper="${escapeAttr(f.name)}">Set as wallpaper</button>`
                    : "") +
                '</div>').join("") + '</div>';
        }

        function isPicture(name) {
            return /\.(png|jpe?g|gif|webp|bmp|avif)$/i.test(name || "");
        }

        async function setWallpaper(name) {
            try {
                const resp = await fetch(`${API_BASE}/files/wallpaper`, {
                    method: "POST", headers: getHeaders(), body: JSON.stringify({name}),
                });
                const data = await resp.json();
                if (data.ok) { buzz(6); showNotice(data.message || "Wallpaper set"); }
                else showError(data.message || "Could not set the wallpaper");
            } catch (e) {
                showError("Connection error");
            }
        }

        function renderFiles(el) {
            el.innerHTML = sectionHtml("Send to the PC",
                '<label class="fileinput">Pick a file from this phone' +
                '<input type="file" id="fileInput" multiple></label>' +
                '<div class="progress-track hidden" id="uploadBar"><span></span></div>') +
                sectionHtml("On the PC", '<div id="fileList"></div>');
            renderUploadProgress();
            renderFileList();
            fetchFiles();
        }

        // === Screenshot ===
        // One frame, on request. No timer and no auto-refresh: this is not a
        // stream, and the portal prompt on the PC is stated up front rather
        // than discovered.
        let shotUrl = "";
        let shotBusy = false;
        let shotError = "";

        function renderScreenshot(el) {
            el.innerHTML = sectionHtml("PC screen",
                '<div class="btnrow">' +
                `<button class="primary" id="shotTake"${shotBusy ? " disabled" : ""}>` +
                (shotBusy ? "Taking…" : "Take a screenshot") + '</button></div>' +
                '<div class="section-note" id="shotStatus"></div>' +
                (shotUrl ? `<img id="shotImage" src="${shotUrl}" alt="The PC screen" ` +
                           'style="width:100%;border-radius:12px;margin-top:12px">' : ""));
            const shot = document.getElementById("shotImage");
            if (shot) {
                shot.onerror = () => {
                    // Same rule as the album art: no placeholder standing in
                    // for a picture, a sentence saying what went wrong.
                    shotUrl = "";
                    shotError = "The screenshot arrived but this browser would not show it.";
                    renderScreenshot(document.getElementById("content"));
                };
            }
            paintShotStatus();
        }

        function paintShotStatus() {
            const note = document.getElementById("shotStatus");
            if (!note) return;
            note.textContent = shotError ||
                (shotBusy ? "Waiting for the PC — the first one asks for permission there."
                          : "Taken on request only. The PC may ask you to allow it.");
        }

        async function takeScreenshot() {
            if (shotBusy) return;
            shotBusy = true;
            shotError = "";
            renderScreenshot(document.getElementById("content"));
            try {
                const resp = await fetch(`${API_BASE}/screenshot`, {headers: getHeaders()});
                if (!resp.ok) {
                    let info = {};
                    try { info = await resp.json(); } catch (e) {}
                    shotError = info.message || `Screenshot failed (${resp.status})`;
                } else {
                    if (shotUrl) URL.revokeObjectURL(shotUrl);
                    shotUrl = URL.createObjectURL(await resp.blob());
                }
            } catch (e) {
                shotError = "Connection error";
            } finally {
                shotBusy = false;
                renderScreenshot(document.getElementById("content"));
            }
        }

        // === Installed app ===
        // The worker gives the page a home-screen icon and a slot in Android's
        // share sheet. A share POST carries no headers, so the worker parks the
        // payload and the page -- which holds the credential -- sends it on.
        function registerWorker() {
            if (!("serviceWorker" in navigator)) return;
            navigator.serviceWorker.register("/sw.js", {scope: "/"}).catch(() => {});
        }

        async function deliverShare() {
            const url = new URL(window.location);
            if (!url.searchParams.get("share")) return;
            url.searchParams.delete("share");
            history.replaceState({}, "", url.pathname + (url.searchParams.toString() ? "?" + url.searchParams : "") + url.hash);
            if (authState !== "ok" || !("caches" in window)) return;

            let cache, meta;
            try {
                cache = await caches.open("gnomespeak-share");
                const stored = await cache.match("/_share/meta");
                if (!stored) return;
                meta = await stored.json();
            } catch (e) { return; }

            let sent = 0;
            for (const entry of (meta.files || [])) {
                try {
                    const hit = await cache.match(entry.key);
                    if (!hit) continue;
                    const blob = await hit.blob();
                    if (await uploadFile(new File([blob], entry.name, {type: blob.type}))) sent++;
                    await cache.delete(entry.key);
                } catch (e) { /* the next one may still work */ }
            }
            await cache.delete("/_share/meta");

            const text = [meta.url, meta.text].filter(Boolean).join(" ").trim();
            if (!meta.files || !meta.files.length) {
                if (!text) return;
                clipboardDraft = text;
                navPush("clipboard:");
                // A shared link goes to the clipboard *and* opens: sharing a
                // page from the phone means "put this on the big screen", and
                // making that two taps was the whole gap this closed.
                await pushClipboard();
                if (looksLikeLink(text)) await openOnPC(text);
            } else if (sent) {
                navPush("files:");
            }
        }

        // === Startup ===
        // bootstrap() decides whether this browser polls or pairs, so the poll
        // interval is started there rather than unconditionally here: an
        // unpaired phone hammering /api/state at 1 Hz just feeds the rate
        // limiter its own lockout.
        initAuth();
        bindDelegatedHandlers();
        render();
        bootstrap().then(deliverShare);
        registerWorker();
    </script>
</body>
</html>
