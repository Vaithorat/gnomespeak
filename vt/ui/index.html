                ` data-action="${escapeAttr(action.id)}"` +
                ` aria-label="${escapeAttr(action.label)}">${escapeHtml(icon)}</button>`;
        }

        function playerTargets() {
            if (!state || !state.targets) return [];
            return state.targets.filter(t => t.kind === "player" || t.kind === "youtube_player");
        }

        // --- home ------------------------------------------------------------

        // === Pinned targets ===================================================
        // Four things get used every evening and the rest almost never. Which
        // four is a matter for the phone, not the PC, so the list lives here
        // and travels with the browser that made it.
        function pinnedIds() {
            try {
                const saved = JSON.parse(localStorage.getItem("vt_pins") || "[]");
                return Array.isArray(saved) ? saved.filter(id => typeof id === "string") : [];
            } catch (e) {
                return [];
            }
        }

        function isPinned(id) {
            return pinnedIds().indexOf(id) !== -1;
        }

        function togglePin(id) {
            const pins = pinnedIds();
            const at = pins.indexOf(id);
            if (at === -1) pins.push(id); else pins.splice(at, 1);
            try { localStorage.setItem("vt_pins", JSON.stringify(pins.slice(0, 12))); } catch (e) {}
            buzz(6);
            render();
        }

        function pinnedHtml() {
            // Only what the PC currently has: a pin for a window that was
            // closed is not a row, it is a promise the page cannot keep.
            const rows = pinnedIds()
                .map(id => findTarget(id))
                .filter(Boolean)
                .map(t => rowHtml({
                    icon: t.icon || KIND_ICONS[t.kind] || "●",
                    title: t.title,
                    sub: [t.subtitle, t.status].filter(Boolean).join(" · "),
                    target: t.id,
                    sheet: t.id,
                    chevron: true,
                }))
                .join("");
            return rows ? sectionHtml("Pinned", `<div class="card">${rows}</div>`) : "";
        }

        function renderHome(el) {
            let html = searchHtml("homeSearch", "Search apps, windows, anything", homeQuery);
            html += '<div id="homeResults"></div>';
            el.innerHTML = html;
            renderHomeResults();
        }

        function renderHomeResults() {
            const box = document.getElementById("homeResults");
            if (!box) return;
            box.innerHTML = homeQuery.trim() ? homeSearchHtml() : homeDashboardHtml();
        }

        function homeDashboardHtml() {
            let html = pinnedHtml();

            // 1. What is playing, with its controls already on screen.
            const players = playerTargets();
            if (players.length) {
                html += sectionHtml("Now playing",
                    players.map(t => playerCardHtml(t)).join(""));
            }

            // 2. One-tap toggles. Each of these was three taps away before.
            const tiles = quickTilesHtml();
            if (tiles) html += sectionHtml("Quick actions", `<div class="tiles">${tiles}</div>`);

            // 3. The two sliders anyone actually reaches for.
            let sliders = "";
            const audio = findTarget("system:audio");
            const vol = findAction(audio, "volume");
            if (audio && vol) sliders += sliderHtml(audio, vol);
            const display = findTarget("system:display");
            const bright = findAction(display, "brightness");
            if (display && bright) sliders += sliderHtml(display, bright);
            if (sliders) html += sectionHtml("", `<div class="card">${sliders}</div>`);

            // 4. Everything else, one tap deep and counted so it is obvious
            //    which rows are worth opening.
            const order = ["window", "workspace", "app", "streaming", "steam",
                           "bluetooth", "system", "command"];
            let rows = "";
            order.forEach(kind => {
                const list = targets(kind);
                if (!list.length) return;
                rows += rowHtml({
                    icon: KIND_ICONS[kind] || "●",
                    title: kindLabel(kind),
                    badge: list.length,
                    category: kind,
                    chevron: true,
                });
            });
            rows += rowHtml({
                icon: "🔑", title: "Paired devices",
                nav: "devices:list", chevron: true,
            });
            html += sectionHtml("Browse", `<div class="card">${rows}</div>`);
            return html;
        }

        // The server sends one action whose label is already the verb ("Do
        // not disturb" / "Allow notifications"). Pairing that with the raw
        // status read as a contradiction, so the state is spelled out instead.
        function notifToggle(notif) {
            if (!notif || !notif.actions || !notif.actions.length) return null;
            const action = notif.actions[0];
            const quiet = action.id === "dnd_off";
            return {
                action: action,
                quiet: quiet,
                icon: quiet ? "🔕" : "🔔",
                short: quiet ? "Notify" : "Silence",
                state: quiet ? "Notifications are silenced" : "Notifications are showing",
            };
        }

        function quickTilesHtml() {
            let html = "";

            const audio = findTarget("system:audio");
            const mute = findAction(audio, "mute");
            if (audio && mute) {
                const muted = audio.status === "muted";
                html += tileHtml({
                    icon: muted ? "🔇" : "🔊",
                    label: mute.label,
                    target: audio.id, action: mute.id, on: muted,
                });
            }

            const notif = findTarget("system:notifications");
            const dnd = notifToggle(notif);
            if (dnd) {
                html += tileHtml({
                    icon: dnd.icon, label: dnd.short,
                    target: notif.id, action: dnd.action.id, on: dnd.quiet,
                });
            }

            const power = findTarget("system:power");
            const lock = findAction(power, "lock");
            if (lock) {
                html += tileHtml({icon: "🔒", label: "Lock", target: power.id, action: lock.id});
            }

            html += tileHtml({icon: "▶", label: "YouTube", nav: "youtube:search"});
            // The touchpad is the one screen people reach for mid-task, so it
            // gets a tile rather than living only under System.
            html += tileHtml({icon: "🖱", label: "Touchpad", nav: "input:touchpad"});

            if (targets("streaming").length) {
                html += tileHtml({icon: "📺", label: "Streaming", category: "streaming"});
            }

            html += tileHtml({icon: "▸", label: "Launch app", tab: "apps"});

            const suspend = findAction(power, "suspend");
            if (suspend) {
                html += tileHtml({icon: "💤", label: "Suspend", target: power.id, action: suspend.id});
            }

            return html;
        }

        // One field over everything the phone can reach: running windows, apps
        // on disk, streaming services, commands. Two taps from opening the page
        // to launching anything by name.
        function homeSearchHtml() {
            const q = homeQuery.trim().toLowerCase();
            const tokens = q.split(/\s+/).filter(Boolean);
            const matches = (hay) => tokens.every(tok => hay.toLowerCase().includes(tok));

            let html = "";
            const groups = [
                ["Open now", ["player", "youtube_player", "window", "app"]],
                ["Shortcuts", ["streaming", "command", "workspace", "bluetooth", "system"]],
            ];

            groups.forEach(([label, kinds]) => {
                const list = (state.targets || []).filter(t =>
                    kinds.indexOf(t.kind) !== -1 &&
                    matches(`${t.title} ${t.subtitle || ""} ${kindLabel(t.kind)}`));
                if (!list.length) return;
                html += sectionHtml(label,
                    `<div class="card">${list.slice(0, 12).map(targetRowHtml).join("")}</div>`);
            });

            if (installedApps === null) {
                fetchApps();
                html += sectionHtml("Installed", '<div class="empty">Loading apps…</div>');
            } else {
                const apps = installedApps.filter(a =>
                    matches(`${a.title} ${a.subtitle || ""} ${a.id}`)).slice(0, 12);
                if (apps.length) {
                    html += sectionHtml("Installed",
                        `<div class="card">${apps.map(a => rowHtml({
                            icon: a.icon || "▸",
                            title: a.title,
                            sub: a.subtitle,
                            target: a.id,
                            action: "launch",
                        })).join("")}</div>`);
                }
            }

            html += sectionHtml("", `<div class="card">${rowHtml({
                icon: "▶",
                title: `Search YouTube for "${homeQuery.trim()}"`,
                ytSearch: true,
                chevron: true,
            })}</div>`);

            return html;
        }

        function targetRowHtml(t) {
            const primary = primaryAction(t);
            const extra = (t.actions || []).filter(a => a && a.id !== (primary && primary.id));
            const on = t.status === "playing" || t.status === "active" || t.status === "connected";
            // "configured" on every command row is noise: it says nothing that
            // the row's presence does not already say.
            const meta = t.status && !t.subtitle && t.status !== "configured" ? t.status : "";
            if (!primary) {
                // Nothing obvious to run on a tap, so the row opens its own
                // sheet rather than a whole screen -- unless it has no actions
                // at all, where tapping could only ever say "no actions".
                return rowHtml({
                    icon: t.icon || KIND_ICONS[t.kind] || "●",
                    title: t.title,
                    sub: t.subtitle,
                    meta: meta,
                    sheet: extra.length ? t.id : "",
                    chevron: extra.length > 0,
                    on: on,
                });
            }
            return rowHtml({
                icon: t.icon || KIND_ICONS[t.kind] || "●",
                title: t.title,
                sub: t.subtitle,
                meta: meta,
                target: t.id,
                action: primary.id,
                confirm: primary.kind === "confirm",
                danger: primary.kind === "confirm",
                more: extra.length ? t.id : "",
                on: on,
            });
        }

        // --- media -----------------------------------------------------------

        function renderMedia(el) {
            let html = "";
            const players = playerTargets();
            if (players.length) {
                html += sectionHtml("Now playing", players.map(t =>
                    playerCardHtml(t, {extra: ["fullscreen", "mute"]})).join(""));
            } else {
                html += '<div class="empty">Nothing is playing.</div>';
            }

            const audio = findTarget("system:audio");
            const vol = findAction(audio, "volume");
            if (audio && vol) {
                let card = sliderHtml(audio, vol);
                const mute = findAction(audio, "mute");
                if (mute) {
                    card += rowHtml({
                        icon: audio.status === "muted" ? "🔇" : "🔊",
                        title: mute.label, target: audio.id, action: mute.id,
                        on: audio.status === "muted",
                    });
                }
                html += sectionHtml("System volume", `<div class="card">${card}</div>`);
            }

            let rows = rowHtml({
                icon: "⏭", title: "Up next",
                sub: "from what's playing", related: true,
            });
            rows += rowHtml({
                icon: "▶", title: "Search YouTube",
                nav: "youtube:search", chevron: true,
            });
            const streaming = targets("streaming");
            if (streaming.length) {
                rows += rowHtml({
                    icon: "📺", title: "Streaming services",
                    badge: streaming.length, category: "streaming", chevron: true,
                });
            }
            html += sectionHtml("Watch", `<div class="card">${rows}</div>`);

            el.innerHTML = html;
        }

        // --- apps ------------------------------------------------------------

        function renderApps(el) {
            let html = searchHtml("appSearch", "Search apps and windows", installedQuery);
            html += '<div class="chips">';
            [["all", "All"], ["running", "Open"], ["installed", "Installed"],
             ["streaming", "Streaming"]].forEach(([id, label]) => {
                html += `<button class="chip${appsFilter === id ? " active" : ""}" data-filter="${id}">` +
                        `${escapeHtml(label)}</button>`;
            });
            html += '</div><div id="appList"></div>';
            el.innerHTML = html;

            renderAppList();
            if (installedApps === null) fetchApps();
        }

        // Only the list is rebuilt when the query changes: re-rendering the
        // whole view would drop the caret and close the phone keyboard.
        function renderAppList() {
            const list = document.getElementById("appList");
            if (!list) return;

            const tokens = installedQuery.toLowerCase().split(/\s+/).filter(Boolean);
            const matches = (hay) => tokens.every(tok => hay.toLowerCase().includes(tok));
            let html = "";

            if (appsFilter === "all" || appsFilter === "running") {
                const open = (state && state.targets ? state.targets : []).filter(t =>
                    (t.kind === "window" || t.kind === "app") &&
                    matches(`${t.title} ${t.subtitle || ""}`));
                if (open.length) {
                    html += sectionHtml("Open now",
                        `<div class="card">${open.map(targetRowHtml).join("")}</div>`);
                }
            }

            if (appsFilter === "all" || appsFilter === "streaming") {
                const services = (state && state.targets ? state.targets : []).filter(t =>
                    (t.kind === "streaming" || t.kind === "steam") &&
                    matches(`${t.title} ${t.subtitle || ""}`));
                if (services.length) {
                    html += sectionHtml("Streaming & games",
                        `<div class="card">${services.map(targetRowHtml).join("")}</div>`);
                }
            }

            if (appsFilter === "all" || appsFilter === "installed") {
                if (installedApps === null) {
                    html += installedError
                        ? `<div class="empty">${escapeHtml(installedError)}</div>`
                        : '<div class="empty">Loading apps…</div>';
                } else {
                    // Names, generic names and comments come from .desktop files
                    // on disk -- less hostile than a window title, but escaped
                    // all the same, since one bad entry would run script on this
                    // origin.
                    const apps = installedApps.filter(app =>
                        matches(`${app.title} ${app.subtitle || ""} ${app.id}`));
                    if (apps.length) {
                        html += sectionHtml("Installed",
                            `<div class="card">${apps.map(app => rowHtml({
                                icon: app.icon || "▸",
                                title: app.title,
                                sub: app.subtitle,
                                target: app.id,
                                action: "launch",
                            })).join("")}</div>`);
                    }
                }
            }

            if (!html) html = '<div class="empty">Nothing matches.</div>';
            list.innerHTML = html;
        }

        // --- system ----------------------------------------------------------

        function renderSystem(el) {
            let html = "";

            // First thing on the screen when it applies: without the extension
            // four features are missing at once, and each of them failing on
            // its own is what made this look like four separate bugs.
            const ext = findTarget("system:extension");
            if (ext) {
                html += sectionHtml("", `<div class="card">${rowHtml({
                    icon: ext.icon || "⚠", title: ext.title, sub: ext.note,
                    wrap: true, danger: true,
                })}</div>`);
            }

            html += sectionHtml("Remote control", '<div class="card">' +
                rowHtml({icon: "🖱", title: "Touchpad & keyboard",
                         sub: "Move the pointer, type, present", nav: "input:touchpad", chevron: true}) +
                rowHtml({icon: "📋", title: "Clipboard",
                         sub: "Copy text between phone and PC", nav: "clipboard:view", chevron: true}) +
                rowHtml({icon: "🔔", title: "Notifications",
                         sub: "What the PC is showing", nav: "notifs:view", chevron: true}) +
                rowHtml({icon: "📁", title: "Files",
                         sub: "Send a file to the PC, or take one back", nav: "files:view", chevron: true}) +
                rowHtml({icon: "🖼", title: "Screenshot",
                         sub: "One still frame of the PC screen", nav: "screen:view", chevron: true}) +
                '</div>');

            let sliders = "";
            const audio = findTarget("system:audio");
            const vol = findAction(audio, "volume");
            if (audio && vol) sliders += sliderHtml(audio, vol);
            const display = findTarget("system:display");
            const bright = findAction(display, "brightness");
            if (display && bright) sliders += sliderHtml(display, bright);
            if (sliders) html += sectionHtml("", `<div class="card">${sliders}</div>`);

            let toggles = "";
            const mute = findAction(audio, "mute");
            if (audio && mute) {
                toggles += rowHtml({
                    icon: audio.status === "muted" ? "🔇" : "🔊",
                    title: mute.label, target: audio.id, action: mute.id,

                });
            }
            const notif = findTarget("system:notifications");
            const dnd = notifToggle(notif);
            if (dnd) {
                toggles += rowHtml({
                    icon: dnd.icon, title: dnd.action.label, sub: dnd.state,

                });

            if (toggles) html += sectionHtml("Toggles", `<div class="card">${toggles}</div>`);

            const workspaces = targets("workspace");
            if (workspaces.length) {
                html += sectionHtml("Workspaces",
                    `<div class="card">${workspaces.map(targetRowHtml).join("")}</div>`);
            }

            const bt = targets("bluetooth");
            if (bt.length) {
                html += sectionHtml("Bluetooth",
                    `<div class="card">${bt.map(targetRowHtml).join("")}</div>`);
            }

            const commands = targets("command");
            if (commands.length) {
                html += sectionHtml("Commands",
                    `<div class="card">${commands.map(targetRowHtml).join("")}</div>`);
            }

            const power = findTarget("system:power");
            if (power) {
                let tiles = "";
                (power.actions || []).forEach(a => {
                    const icons = {
                        lock: "🔒", suspend: "💤",
                        restart: "↻", shutdown: "⏻",
                    };
                    tiles += tileHtml({
                        icon: icons[a.id] || "⚙", label: a.label,
                        target: power.id, action: a.id,
                        confirm: a.kind === "confirm", danger: a.kind === "confirm",
                    });
                });
                html += sectionHtml("Power", `<div class="tiles">${tiles}</div>`,
                                    null, {note: power.subtitle || power.status});
            }

            html += sectionHtml("This device", '<div class="card">' + rowHtml({
                icon: "🔑", title: "Paired devices",
                nav: "devices:list", chevron: true,
            }) + rowHtml({
                icon: "🩺", title: "What works",
                sub: healthSummary || "What the PC can and cannot do right now",
                nav: "health:list", chevron: true,
            }) + rowHtml({
                icon: "📜", title: "Security log",
                sub: "Every action and every rejection",
                nav: "audit:list", chevron: true,
            }) + rowHtml({
                icon: "🖥", title: "Other PCs",
                sub: serverList().length > 1 ? `${serverList().length} saved` : "Add another machine",
                nav: "servers:list", chevron: true,
            }) + '</div>');

            el.innerHTML = html;
        }

        // --- category & target ------------------------------------------------

        function renderCategory(el, kind) {
            const list = (state && state.targets ? state.targets : []).filter(t => t.kind === kind);
            if (!list.length) {
                el.innerHTML = `<div class="empty">No ${escapeHtml(kindLabel(kind).toLowerCase())} right now.</div>`;
                return;
            }
            // Every field here is attacker-influenced: window titles and MPRIS
            // metadata come straight from whatever the user has open, so a page
            // titled `<img onerror=...>` would otherwise run script on this
            // origin -- where the API token lives in localStorage.
            el.innerHTML = `<div class="card">${list.map(targetRowHtml).join("")}</div>`;
        }

        function renderTarget(el, targetId) {
            const target = findTarget(targetId);
            if (!target) {
                el.innerHTML = `<div class="empty">Gone: ${escapeHtml(targetId)}</div>`;
                return;
            }
            el.innerHTML = targetDetailHtml(target);
        }

        function targetDetailHtml(target) {
            let html = "";
            if (target.art) {
                html += `<div class="art"><img data-art="${escapeHtml(target.art)}" alt=""></div>`;
            }
            html += '<div class="sheet-head">';
            html += `<div class="sheet-title">${escapeHtml(target.title)}</div>`;
            const sub = [target.subtitle, target.status].filter(Boolean).join(" · ");
            if (sub) html += `<div class="sheet-sub">${escapeHtml(sub)}</div>`;
            html += '</div>';

            // Why a control the player claims to support is not offered. Without
            // this the absence just looks like a missing feature in vt.
            if (target.note) {
                html += `<div class="sheet-note">${escapeHtml(target.note)}</div>`;
            }

            const sliders = (target.actions || []).filter(a => a && a.kind === "slider");
            if (sliders.length) {
                html += `<div class="card">${sliders.map(a => sliderHtml(target, a)).join("")}</div>`;
            }

            const buttons = (target.actions || []).filter(a => a && a.kind !== "slider");
            if (buttons.length) {
                html += sliders.length ? '<div class="section"></div>' : "";
                html += '<div class="actions">';
                buttons.forEach(action => {
                    const danger = action.kind === "confirm";
                    html += `<button class="abtn${danger ? " danger" : ""}"` +
                        ` data-target="${escapeAttr(target.id)}" data-action="${escapeAttr(action.id)}"` +
                        `${danger ? ' data-confirm="1"' : ""}>${escapeHtml(action.label)}</button>`;
                });
                html += '</div>';
            }

            if (!sliders.length && !buttons.length) {
                html += '<div class="empty">No actions available.</div>';
            }

            html += '<div class="btnrow">' +
                `<button data-pin="${escapeAttr(target.id)}">` +
                (isPinned(target.id) ? "Unpin from home" : "Pin to home") +
                '</button></div>';
            return html;
        }

        // --- action sheet -------------------------------------------------------
        // Opening the full action list as a sheet rather than a new screen: the
        // list underneath keeps its scroll position, so closing it costs nothing.

        function openSheet(targetId) {
            const target = findTarget(targetId);
            if (!target) return;
            sheetTarget = targetId;
            document.getElementById("sheetBody").innerHTML = targetDetailHtml(target);
            document.getElementById("sheetOverlay").classList.remove("hidden");
        }

        function closeSheet() {
            sheetTarget = null;
            document.getElementById("sheetOverlay").classList.add("hidden");
        }

        function refreshSheet() {
            if (!sheetTarget) return;
            const target = findTarget(sheetTarget);
            if (!target) { closeSheet(); return; }
            document.getElementById("sheetBody").innerHTML = targetDetailHtml(target);
        }

        // --- installed (legacy route) --------------------------------------------

        function renderInstalled(el) {
            let html = searchHtml("appSearch", "Search installed apps", installedQuery);
            html += '<div id="appList"></div>';
            el.innerHTML = html;
            renderAppList();
            if (installedApps === null) fetchApps();
        }

        // --- youtube ---------------------------------------------------------------

        function youtubeTarget() {
            if (!state || !state.targets) return null;
            return state.targets.find(t => t.id === "youtube:search") || null;
        }

        function youtubeNotice() {
            const target = youtubeTarget();
            return target && target.note ? target.note : "";
        }

        function renderYoutube(el) {
            let html = "";

            // Anything vt knows will stop the video from playing belongs here,
            // above the search box: finding out after tapping a result means
            // walking to the PC, which is the problem this screen exists to
            // avoid.
            const target = youtubeTarget();
            const notice = youtubeNotice();
            if (notice) {
                html += '<div class="banner">';
                html += `<span class="banner-text">${escapeHtml(notice)}</span>`;
                const fix = (target.actions || []).find(a => a && a.id === "fix_autoplay");
                if (fix) {
                    html += `<button class="abtn danger full"
                        data-target="${escapeAttr(target.id)}" data-action="${escapeAttr(fix.id)}"
                        data-confirm="1">${escapeHtml(fix.label)}</button>`;
                }
                html += '</div>';
            }

            html += searchHtml("youtubeSearch", "Search YouTube", youtubeQuery);

            // Watching one video and wanting the next one is the commonest
            // thing anyone does on YouTube, and typing a search for it from the
            // couch is exactly the friction this screen exists to remove.
            html += `<div class="card">${rowHtml({
                icon: "⏭", title: "Up next",
                sub: "from what's playing", related: true,
            })}</div>`;

            html += '<div id="youtubeList"></div>';
            el.innerHTML = html;
            renderYoutubeResults();
            if (youtubeQuery.trim() && youtubeResults === null && !youtubeSearching) fetchYoutubeResults();
        }

        function renderYoutubeResults() {
            const list = document.getElementById("youtubeList");
            if (!list) return;

            if (youtubeSearching) {
                list.innerHTML = '<div class="empty">Searching…</div>';
                return;
            }

            if (youtubeError) {
                list.innerHTML = `<div class="empty">${escapeHtml(youtubeError)}</div>`;
                return;
            }

            if (youtubeResults === null) {
                list.innerHTML = youtubeQuery.trim()
                    ? '<div class="empty">Searching…</div>'
                    : '<div class="empty">Type to search, or tap Up next.</div>';
                return;
            }

            if (!youtubeResults.length) {
                list.innerHTML = '<div class="empty">No videos found.</div>';
                return;
            }

            let rows = "";
            youtubeResults.forEach(video => {
                const mins = Math.floor(video.duration / 60);
                const secs = video.duration % 60;
                const dur = mins ? `${mins}:${String(secs).padStart(2, "0")}` : `${secs}s`;
                rows += rowHtml({
                    icon: "▶",
                    title: video.title,
                    sub: `${video.channel} · ${dur}`,
                    target: `youtube:${video.url}`,
                    action: "play",
                });
            });
            list.innerHTML = `<div class="section"><div class="card">${rows}</div></div>`;
        }

        // === Pairing ===
        function renderPairing() {
            const el = document.getElementById("content");
            document.getElementById("app").classList.add("no-chrome");
            document.getElementById("backBtn").classList.add("hidden");
            document.getElementById("viewTitle").textContent = "VoiceTalk";
            updateStatus(false);

            let html = '<div class="pair">';
            html += '<div class="pair-title">Pair this device</div>';
            html += '<div class="pair-help">This browser is not paired with your PC yet. ' +
                    'Run <code>vt pair</code> on the PC and enter the code it prints — ' +
                    'or just scan the QR code it shows.</div>';
            if (pairError) {
                html += `<div class="pair-error">${escapeHtml(pairError)}</div>`;
            }
            html += `<input id="pairCode" type="text" inputmode="text" maxlength="13"
                autocomplete="off" autocapitalize="characters" spellcheck="false"
                placeholder="XXXXX-XXXXX" value="${escapeAttr(pairCodeDraft)}">`;
            html += `<input id="pairName" type="text" maxlength="48"
                autocomplete="off" spellcheck="false"
                placeholder="Device name" value="${escapeAttr(pairNameDraft)}">`;
            html += `<button class="pair-submit" id="pairSubmit"${pairBusy ? " disabled" : ""}>` +
                    (pairBusy ? "Pairing…" : "Pair this device") + '</button>';
            html += '</div>';
            el.innerHTML = html;
        }

        async function doPairSubmit() {
            const code = pairCodeDraft.trim();
            if (!code) { pairError = "Enter the code shown on the PC."; renderPairing(); return; }
            const ok = await submitPairing(code, pairNameDraft.trim() || defaultDeviceName());
            if (ok) {
                devicesList = null;
                navTop();
                startUpdates();
            } else {
                renderPairing();
            }
        }

        // === Devices ===
        function renderDevices(el) {
            if (devicesList === null) {
                el.innerHTML = devicesError
                    ? `<div class="empty">${escapeHtml(devicesError)}</div>`
                    : '<div class="empty">Loading…</div>';
                if (!devicesError) fetchDevices();
                return;
            }
            if (!devicesList.length) {
                el.innerHTML = '<div class="empty">No paired devices.</div>';
                return;
            }
            let rows = "";
            devicesList.forEach(d => {
                const isCurrent = d.id === currentDeviceId;
                const seen = d.last_seen ? relativeTime(d.last_seen) : "never";
                const where = d.last_ip ? ` · ${d.last_ip}` : "";
                // A guest phone and a permanent one look identical otherwise,
                // and which is which is the whole reason for pairing a guest.
                const limits = [
                    d.scope === "guest" ? "media only" : "",
                    d.expires ? "until " + relativeTime(d.expires).replace(" ago", "") : "",
                ].filter(Boolean).join(" · ");
                rows += rowHtml({
                    icon: isCurrent ? "📱" : (d.scope === "guest" ? "👤" : "🔑"),
                    title: d.name + (isCurrent ? " (this device)" : ""),
                    sub: `last seen ${seen}${where}` + (limits ? " · " + limits : ""),
                    revoke: d.id,
                    extraClass: isCurrent ? "device-current" : "",
                });
            });
            el.innerHTML = `<div class="card">${rows}</div>`;
        }

        // === Security log ===
        let auditEntries = null;
        let auditError = "";

        async function fetchAudit() {
            try {
                const resp = await fetch(`${API_BASE}/audit?count=80`, {headers: getHeaders()});
                if (!resp.ok) { auditError = `Could not read the log (${resp.status})`; }
                else { auditEntries = (await resp.json()).entries || []; auditError = ""; }
            } catch (e) {
                auditError = "Connection error";
            }
            const el = document.getElementById("auditList");
            if (el) paintAudit(el);
        }

        function auditLine(entry) {
            const bits = [entry.who, entry.device ? entry.device.slice(0, 8) : "", entry.ip,
                          entry.target, entry.action, entry.reason, entry.detail]
                .filter(Boolean);
            return bits.join(" · ");
        }

        function paintAudit(el) {
            if (auditError) { el.innerHTML = `<div class="empty">${escapeHtml(auditError)}</div>`; return; }
            if (auditEntries === null) { el.innerHTML = '<div class="empty">Loading…</div>'; return; }
            if (!auditEntries.length) { el.innerHTML = '<div class="empty">Nothing logged yet.</div>'; return; }
            // Newest first, and a rejection is not a quieter row than an action.
            const rows = auditEntries.slice().reverse().map(entry => {
                const rejected = String(entry.event || "").startsWith("auth.reject") || entry.ok === false;
                return rowHtml({
                    icon: rejected ? "⛔" : "✓",
                    title: entry.event || "event",
                    sub: [auditLine(entry), entry.ts].filter(Boolean).join(" — "),
                    wrap: true,
                    danger: rejected,
                });
            }).join("");
            el.innerHTML = `<div class="card">${rows}</div>`;
        }

        function renderAudit(el) {
            el.innerHTML = sectionHtml("Recent", '<div id="auditList"></div>' +
                '<div class="btnrow"><button id="auditRefresh">Refresh</button></div>');
            paintAudit(document.getElementById("auditList"));
            fetchAudit();
        }

        // === More than one PC ===
        // Switching is navigation, not a cross-origin call. Credentials are
        // per-origin by design -- localStorage keeps them apart, and so does
        // the server's own connect-src policy -- so this list holds names and
        // addresses only, and the other machine's own page holds its secrets.
        function serverList() {
            let saved = [];
            try { saved = JSON.parse(localStorage.getItem("vt_servers") || "[]"); } catch (e) { saved = []; }
            if (!Array.isArray(saved)) saved = [];
            saved = saved.filter(entry => entry && typeof entry.url === "string");
            const here = window.location.origin;
            if (!saved.some(entry => entry.url === here)) {
                saved.unshift({name: "This PC", url: here});
                saveServers(saved);
            }
            return saved;
        }

        function saveServers(list) {
            try { localStorage.setItem("vt_servers", JSON.stringify(list)); } catch (e) {}
        }

        function addServer(name, url, mac) {
            url = (url || "").trim().replace(/\/+$/, "");
            if (!/^https?:\/\//.test(url)) { showError("Enter a full http:// or https:// address"); return; }
            mac = (mac || "").trim();
            if (mac && !/^([0-9a-f]{2}[:-]){5}[0-9a-f]{2}$/i.test(mac)) {
                showError("That is not a MAC address");
                return;
            }
            const list = serverList();
            if (list.some(entry => entry.url === url)) { showError("That PC is already saved"); return; }
            list.push({name: (name || "").trim() || url.replace(/^https?:\/\//, ""),
                       url: url, mac: mac});
            saveServers(list);
            render();
        }

        function removeServer(url) {
            saveServers(serverList().filter(entry => entry.url !== url));
            render();
        }

        // url -> "up" | "down" | "checking". Filled by the PC, because this
        // page cannot ask another origin itself: the browser refuses the
        // cross-origin request and our own CSP says connect-src 'self'.
        let serverReach = {};

        let serverProbing = false;
        let serverProbeAt = 0;

        async function probeServers(force) {
            const here = window.location.origin;
            const urls = serverList().map(e => e.url).filter(u => u !== here);
            if (!urls.length || serverProbing) return;
            const stale = Date.now() - serverProbeAt > 15000;
            const unknown = urls.some(u => !serverReach[u]);
            // Rendering the list must not start a probe that re-renders the
            // list: without this the answer would trigger the next question.
            if (!force && !stale && !unknown) return;
            serverProbing = true;
            serverProbeAt = Date.now();
            urls.forEach(u => { if (!serverReach[u]) serverReach[u] = "checking"; });
            try {
                const resp = await fetch(`${API_BASE}/probe`, {
                    method: "POST", headers: getHeaders(), body: JSON.stringify({urls: urls}),
                });
                const data = await resp.json();
                (data.servers || []).forEach(row => {
                    serverReach[row.url] = row.reachable ? "up" : "down";
                });
            } catch (e) {
                // Not knowing is its own state: showing every PC as unreachable
                // because our own server did not answer would be a lie about
                // them.
                urls.forEach(u => { delete serverReach[u]; });
            }
            serverProbing = false;
            if (selfOwnedView().startsWith("servers:")) render();
        }

        async function wakeServer(mac) {
            try {
                const resp = await fetch(`${API_BASE}/wake`, {
                    method: "POST", headers: getHeaders(), body: JSON.stringify({mac}),
                });
                const data = await resp.json();
                if (!data.ok) { showError(data.message || "Could not send it"); return; }
                buzz(6);
                // Nothing acknowledges a wake packet, so the honest thing to
                // do is check again in a few seconds and let the row answer.
                showNotice("Wake packet sent — checking again shortly");
                setTimeout(() => probeServers(true), 8000);
            } catch (e) {
                showError("Connection error");
            }
        }

        function serverIcon(url, here) {
            if (url === here) return "🟢";
            if (serverReach[url] === "up") return "🖥";
            if (serverReach[url] === "down") return "⚠";
            return "…";
        }

        function serverNote(url, here) {
            if (url === here) return "";
            if (serverReach[url] === "down") return "not answering the PC";
            if (serverReach[url] === "up") return "answering";
            return "checking";
        }

        function renderServers(el) {
            const here = window.location.origin;
            probeServers();
            const rows = serverList().map(entry => rowHtml({
                icon: serverIcon(entry.url, here),
                title: entry.name + (entry.url === here ? " (open now)" : ""),
                sub: [entry.url, serverNote(entry.url, here)].filter(Boolean).join(" · "),
                wrap: true,
                server: entry.url === here ? "" : entry.url,
                extraClass: entry.url === here ? "device-current" : "",
            }) + (entry.mac && serverReach[entry.url] === "down"
                // Offered exactly when it is the useful thing to do: the PC is
                // not answering, and we know how to knock on its door.
                ? `<div class="btnrow"><button data-wake="${escapeAttr(entry.mac)}">` +
                  'Wake it</button></div>'
                : "")).join("");

            el.innerHTML = sectionHtml("Saved PCs", `<div class="card">${rows}</div>`,
                null, {note: "Each PC keeps its own pairing. Switching opens its page. " +
                             "Reachability is checked from this PC, so a machine it can " +
                             "see may still be out of the phone's reach."}) +
                sectionHtml("Add a PC",
                    '<input class="box" id="serverName" placeholder="Name (optional)">' +
                    '<input class="box" id="serverUrl" placeholder="https://your-tunnel.example.com" ' +
                    'autocapitalize="off" autocorrect="off" spellcheck="false">' +
                    '<input class="box" id="serverMac" placeholder="MAC address (optional, to wake it)" ' +
                    'autocapitalize="off" autocorrect="off" spellcheck="false">' +
                    '<div class="btnrow"><button class="primary" id="serverAdd">Save</button></div>');
        }

        async function fetchDevices() {
            try {
                const resp = await fetch(`${API_BASE}/devices`, {headers: getHeaders()});
                if (!resp.ok) {
                    devicesError = `Error ${resp.status}`;
                } else {
                    const data = await resp.json();
                    devicesList = data.devices || [];
                    currentDeviceId = data.current || currentDeviceId;
                    devicesError = "";
                }
            } catch (e) {
                devicesError = "Connection error";
            }
            if (isDevicesView()) renderDevices(document.getElementById("content"));
        }

        async function revokeDevice(id) {
            // Revoking the device you are holding is a logout, and the phone
            // has to be told that before its next poll 401s at it.
            const self = id === currentDeviceId;
            try {
                const resp = await fetch(`${API_BASE}/devices/revoke`, {
                    method: "POST",
                    headers: getHeaders(),
                    body: JSON.stringify({id: id}),
                });
                const data = await resp.json().catch(() => ({}));
                if (!resp.ok || !data.ok) {
                    showError(data.message || `Revoke failed (${resp.status})`);
                    return;
                }
            } catch (e) {
                showError("Connection error");
                return;
            }
            if (self) {
                forgetDevice();
                devicesList = null;
                navTop();
                enterPairing();
                return;
            }
            showNotice("Device revoked");
            devicesList = null;
            fetchDevices();
        }

        function relativeTime(epochSeconds) {
            const delta = Date.now() / 1000 - epochSeconds;
            if (!epochSeconds || delta < 0) return "never";
            if (delta < 60) return "just now";
            if (delta < 3600) return `${Math.floor(delta / 60)} min ago`;
            if (delta < 86400) return `${Math.floor(delta / 3600)} h ago`;
            return `${Math.floor(delta / 86400)} d ago`;
        }

        // === Input handling ===

        let sliderTimeout = null;
        let youtubeSearchTimeout = null;

        function handleSliderChange(input) {
            const targetId = input.dataset.target;
            const actionId = input.dataset.action;
            const value = input.value;
            // Paint the new value immediately; the server confirms a beat later.
            const pct = Math.round(parseFloat(value) * 100);
            const row = input.closest(".slider-row");
            const label = row ? row.querySelector(".slider-value") : null;
            if (label) label.textContent = pct + '%';

            // Freeze re-renders while dragging so the thumb stays put.
            holdRender(900);

            clearTimeout(sliderTimeout);
            sliderTimeout = setTimeout(() => {
                doAction(targetId, actionId, parseFloat(value), {silent: true});
                // Keep holding past the round trip: the next poll may still
                // carry the pre-change reading and would snap the thumb back.
                holdRender(900);
            }, 120);
        }

        function actionLabel(targetId, actionId) {
            const target = findTarget(targetId);
            const action = findAction(target, actionId);
            return action ? action.label : "";
        }

        function handleAction(targetId, actionId, isConfirm) {
            buzz(8);
            if (isConfirm) {
                currentConfirm = {targetId, actionId};
                // "Confirm this action?" gave no way to tell Close from a
                // browser restart -- name the action, and the thing it lands
                // on: the sheet that gave that away is gone by now.
                const label = actionLabel(targetId, actionId);
                const target = findTarget(targetId);
                document.getElementById("confirmText").textContent =
                    label ? `${label}?` : "Confirm this action?";
                const subEl = document.getElementById("confirmSub");
                subEl.textContent = target ? target.title : "";
                subEl.classList.toggle("hidden", !target || !target.title);
                document.getElementById("confirmOverlay").classList.remove("hidden");
                return;
            }
            const label = actionLabel(targetId, actionId);
            if (actionId === "launch" || actionId === "play") {
                // Silent: a launch changes nothing this view shows, and a
                // re-render would wipe the search box. The toast is the
                // feedback instead.
                doAction(targetId, actionId, undefined, {
                    silent: true, notice: true, label: label ? label + "…" : "Opening…",
                });
                return;
            }
            doAction(targetId, actionId).then(refreshSheet);
        }

        function doConfirm() {
            if (currentConfirm) {
                // Confirmed actions are the consequential ones -- a close, a
                // quit, a browser restart. Showing what came back is how the
                // user knows it happened without checking the PC.
                doAction(currentConfirm.targetId, currentConfirm.actionId, undefined,
                         {notice: true, label: actionLabel(currentConfirm.targetId, currentConfirm.actionId)})
                    .then(refreshSheet);
                cancelConfirm();
            }
        }

        function cancelConfirm() {
            currentConfirm = null;
            document.getElementById("confirmOverlay").classList.add("hidden");
        }

        function setSearchValue(id, value) {
            const input = document.getElementById(id);
            if (input) input.value = value;
            const clear = document.querySelector(`[data-clear="${id}"]`);
            if (clear) clear.classList.toggle("hidden", !value);
        }

        function onSearchInput(id, value) {
            const clear = document.querySelector(`[data-clear="${id}"]`);
            if (clear) clear.classList.toggle("hidden", !value);
            if (id === "homeSearch") {
                homeQuery = value;
                lastSignature = viewSignature();
                renderHomeResults();
            } else if (id === "appSearch") {
                installedQuery = value;
                renderAppList();
            } else if (id === "youtubeSearch") {
                youtubeQuery = value;
                youtubeResults = value.trim() ? null : [];
                youtubeError = "";
                renderYoutubeResults();
                if (value.trim()) {
                    clearTimeout(youtubeSearchTimeout);
                    youtubeSearchTimeout = setTimeout(fetchYoutubeResults, 600);
                }
            }
        }

        // Handlers are delegated rather than inlined into onclick=. An inline
        // handler puts data in two parsers at once -- the HTML attribute parser
        // decodes entities before JS sees the string -- so no single escape is
        // correct there. Data attributes have exactly one parser.
        function bindDelegatedHandlers() {
            const content = document.getElementById("content");

            document.getElementById("confirmCancel").addEventListener("click", cancelConfirm);
            document.getElementById("confirmOk").addEventListener("click", doConfirm);
            document.getElementById("backBtn").addEventListener("click", navPop);

            document.getElementById("tabbar").addEventListener("click", (ev) => {
                const tabBtn = ev.target.closest("[data-tab]");
                if (tabBtn) { buzz(5); setTab(tabBtn.dataset.tab); }
            });

            document.getElementById("sheetOverlay").addEventListener("click", (ev) => {
                if (ev.target.id === "sheetOverlay") closeSheet();
            });

            const clickHandler = (ev) => {
                if (ev.target.closest("#pairSubmit")) { doPairSubmit(); return; }

                const clear = ev.target.closest("[data-clear]");
                if (clear) {
                    setSearchValue(clear.dataset.clear, "");
                    onSearchInput(clear.dataset.clear, "");
                    const input = document.getElementById(clear.dataset.clear);
                    if (input) input.focus();
                    return;
                }

                const revoke = ev.target.closest("[data-revoke]");
                if (revoke) { revokeDevice(revoke.dataset.revoke); return; }

                const serverRow = ev.target.closest("[data-server]");
                if (serverRow) {
                    const url = serverRow.dataset.server;
                    if (ev.target.closest("[data-server-remove]")) { removeServer(url); return; }
                    window.location.href = url;
                    return;
                }
                if (ev.target.closest("#auditRefresh")) { fetchAudit(); return; }
                if (ev.target.closest("#healthRefresh")) { fetchHealth(); return; }
                if (ev.target.closest("#serverAdd")) {
                    const name = document.getElementById("serverName");
                    const url = document.getElementById("serverUrl");
                    const mac = document.getElementById("serverMac");
                    addServer(name ? name.value : "", url ? url.value : "",
                              mac ? mac.value : "");
                    return;
                }

                const wake = ev.target.closest("[data-wake]");
                if (wake) { wakeServer(wake.dataset.wake); return; }

                const unmute = ev.target.closest("[data-unmute]");
                if (unmute) { muteApp(unmute.dataset.unmute, false); return; }

                const dismissBtn = ev.target.closest("[data-dismiss]");
                if (dismissBtn) { dismissNotification(dismissBtn.dataset.dismiss); return; }

                const clickBtn = ev.target.closest("[data-click]");
                if (clickBtn) {
                    buzz(5);
                    sendInput({op: "click", button: clickBtn.dataset.click,
                               double: clickBtn.dataset.double === "1"});
                    return;
                }

                const keyBtn = ev.target.closest("[data-keys]");
                if (keyBtn) {
                    buzz(5);
                    sendInput({op: "keys", keys: keyBtn.dataset.keys});
                    return;
                }

                if (ev.target.closest("#dictate")) { toggleDictation(); return; }

                if (ev.target.closest("#typeSend")) {
                    const box = document.getElementById("typeBox");
                    const text = box ? box.value : typeDraft;
                    if (!text) { showError("Nothing to type"); return; }
                    buzz(8);
                    sendInput({op: "type", text}, {notice: true});
                    // Cleared on send: the box is an outbox, and leaving the
                    // last message in it is how the same line gets typed twice.
                    if (box) box.value = "";
                    typeDraft = "";
                    return;
                }

                if (ev.target.closest("#shotTake")) { takeScreenshot(); return; }
                if (ev.target.closest("#clipGet")) { fetchClipboard(); return; }
                if (ev.target.closest("#clipSend")) { pushClipboard(); return; }
                if (ev.target.closest("#clipCopy")) { copyToPhone(); return; }
                if (ev.target.closest("#clipOpen")) { openOnPC(); return; }
                if (ev.target.closest("#clipHistoryClear")) { clearClipHistory(); return; }
                const clipRow = ev.target.closest("[data-clip]");
                if (clipRow) { useClip(clipRow.dataset.clip); return; }

                if (ev.target.closest("#pushToggle")) {
                    if (pushState === "on") disablePush(); else enablePush();
                    return;
                }
                if (ev.target.closest("#notifClear")) {
                    notifs = [];
                    renderNotifList();
                    return;
                }

                const download = ev.target.closest("[data-download]");
                if (download) { downloadFile(download.dataset.download); return; }

                const openFile = ev.target.closest("[data-openfile]");
                if (openFile) { openFileOnPc(openFile.dataset.openfile, openFile); return; }

                const pin = ev.target.closest("[data-pin]");
                if (pin) { togglePin(pin.dataset.pin); return; }

                const wallpaper = ev.target.closest("[data-wallpaper]");
                if (wallpaper) { setWallpaper(wallpaper.dataset.wallpaper); return; }

                const more = ev.target.closest("[data-more]");
                if (more) { buzz(5); openSheet(more.dataset.more); return; }

                const ytSearch = ev.target.closest("[data-yt-search]");
                if (ytSearch) {
                    // Carry the query across rather than handing back an empty
                    // search box: retyping it is the tax this row exists to skip.
                    youtubeQuery = homeQuery.trim();
                    youtubeResults = null;
                    youtubeError = "";
                    buzz(8);
                    navPush("youtube:search");
                    fetchYoutubeResults();
                    return;
                }

                const related = ev.target.closest("[data-yt-related]");
                if (related) {
                    buzz(8);
                    if (!isYoutubeView()) navPush("youtube:search");
                    fetchYoutubeRelated();
                    return;
                }

                const filter = ev.target.closest("[data-filter]");
                if (filter) { appsFilter = filter.dataset.filter; lastSignature = null; render(); return; }

                const action = ev.target.closest("[data-action]");
                if (action && action.tagName !== "INPUT" && action.dataset.target) {
                    if (ev.currentTarget.id === "sheetBody") closeSheet();
                    handleAction(action.dataset.target, action.dataset.action,
                                 action.dataset.confirm === "1");
                    return;
                }

                const tabBtn = ev.target.closest("[data-tab]");
                if (tabBtn) { setTab(tabBtn.dataset.tab); return; }

                const category = ev.target.closest("[data-category]");
                if (category && category.dataset.category) { navCategory(category.dataset.category); return; }

                const navEl = ev.target.closest("[data-nav]");
                if (navEl) { navPush(navEl.dataset.nav); return; }
            };

            content.addEventListener("click", clickHandler);
            document.getElementById("sheetBody").addEventListener("click", clickHandler);

            // Long-press on Android raises contextmenu. A notification row
            // already carries Dismiss, and a second button would leave neither
            // of them a thumb's width, so muting the app lives here.
            content.addEventListener("contextmenu", (ev) => {
                const row = ev.target.closest("[data-mute]");
                if (!row) return;
                ev.preventDefault();
                muteApp(row.dataset.mute, true);
            });

            const keyHandler = (ev) => {
                if (ev.key === "Enter" && (ev.target.id === "pairCode" || ev.target.id === "pairName")) {
                    ev.preventDefault();
                    doPairSubmit();
                }
                if (ev.key === "Enter" && ev.target.id === "youtubeSearch") {
                    ev.preventDefault();
                    ev.target.blur();
                    clearTimeout(youtubeSearchTimeout);
                    fetchYoutubeResults();
                }
            };
            content.addEventListener("keydown", keyHandler);

            // A file input fires change, not click: picking a file is the whole
            // gesture, and there is no button to press afterwards.
            content.addEventListener("change", (ev) => {
                if (ev.target.id !== "fileInput" || !ev.target.files || !ev.target.files.length) return;
                uploadFiles(ev.target.files);
                ev.target.value = "";
            });

            const inputHandler = (ev) => {
                if (ev.target.id === "pairCode") { pairCodeDraft = ev.target.value; return; }
                if (ev.target.id === "pairName") { pairNameDraft = ev.target.value; return; }
                if (ev.target.id === "typeBox") { typeDraft = ev.target.value; return; }
                if (ev.target.id === "clipBox") {
                    const wasLink = looksLikeLink(clipboardDraft);
                    clipboardDraft = ev.target.value;
                    // Re-render only when the answer changed, so typing does
                    // not rebuild the box under the thumb on every keystroke.
                    if (wasLink !== looksLikeLink(clipboardDraft) && isClipboardView()) {
                        renderClipboard(document.getElementById("content"));
                        const box = document.getElementById("clipBox");
                        if (box) { box.focus(); box.setSelectionRange(box.value.length, box.value.length); }
                    }
                    return;
                }
                if (ev.target.type === "search") { onSearchInput(ev.target.id, ev.target.value); return; }
                const slider = ev.target.closest('input[type="range"][data-action]');
                if (slider) handleSliderChange(slider);
            };
            content.addEventListener("input", inputHandler);
            document.getElementById("sheetBody").addEventListener("input", inputHandler);

            document.addEventListener("keydown", (ev) => {
                if (ev.key !== "Escape") return;
                if (!document.getElementById("confirmOverlay").classList.contains("hidden")) {
                    cancelConfirm();
                } else if (!document.getElementById("sheetOverlay").classList.contains("hidden")) {
                    closeSheet();
                } else if (navStack.length) {
                    navPop();
                }
            });
        }

        // === Remote input =====================================================
        // The pad streams deltas, never positions: the phone knows nothing
        // about the screen's size or where the pointer currently is, and an
        // absolute jump would fight whoever is also using the mouse. Deltas are
        // coalesced into one request every INPUT_FLUSH_MS, so a fast swipe is
        // twenty requests a second rather than one per touchmove event.
        const INPUT_FLUSH_MS = 50;
        const POINTER_GAIN = 1.8;
        const TAP_MS = 250;
        const TAP_SLOP = 12;

        let padMove = {dx: 0, dy: 0};
        let padScroll = {dx: 0, dy: 0};
        let padTimer = null;
        let padInFlight = false;
        let typeDraft = "";

        async function sendInput(payload, opts) {
            opts = opts || {};
            // A drag is a delta every 50 ms. Over the socket that is a frame;
            // over POST it is a request, a header set and an auth check per
            // millimetre of thumb travel. Only the fire-and-forget ops go this
            // way: anything whose result is shown still asks over REST.
            if (opts.live && liveOpen()) {
                try {
                    ws.send(JSON.stringify(Object.assign({type: "input"}, payload)));
                    return {ok: true};
                } catch (e) { /* fall through to the POST */ }
            }
            try {
                const resp = await fetch(`${API_BASE}/input`, {
                    method: "POST",
                    headers: getHeaders(),
                    body: JSON.stringify(payload),
                });
                const result = await resp.json();
                if (!result.ok) {
                    showError(result.message || "Input failed");
                } else {
                    clearError();
                    if (opts.notice && result.message) showNotice(result.message);
                }
                return result;
            } catch (e) {
                showError("Connection error");
                return {ok: false};
            }
        }

        function schedulePad() {
            if (padTimer || padInFlight) return;
            padTimer = setTimeout(flushPad, INPUT_FLUSH_MS);
        }

        async function flushPad() {
            padTimer = null;
            const move = {dx: Math.round(padMove.dx), dy: Math.round(padMove.dy)};
            const scroll = {dx: Math.round(padScroll.dx), dy: Math.round(padScroll.dy)};
            // Keep the fractional remainder rather than dropping it: a slow
            // drag is a long run of sub-pixel deltas, and rounding each one to
            // zero would make the pointer refuse to move at all.
            padMove = {dx: padMove.dx - move.dx, dy: padMove.dy - move.dy};
            padScroll = {dx: padScroll.dx - scroll.dx, dy: padScroll.dy - scroll.dy};

            const ops = [];
            if (move.dx || move.dy) ops.push({op: "move", dx: move.dx, dy: move.dy});
            if (scroll.dx || scroll.dy) ops.push({op: "scroll", dx: scroll.dx, dy: scroll.dy});
            if (!ops.length) return;

            padInFlight = true;
            try {
                for (const op of ops) await sendInput(op, {live: true});
            } finally {
                padInFlight = false;
                if (Math.round(padMove.dx) || Math.round(padMove.dy) ||
                    Math.round(padScroll.dx) || Math.round(padScroll.dy)) schedulePad();
            }
        }

        function centroid(touches) {
            let x = 0, y = 0;
            for (let i = 0; i < touches.length; i++) { x += touches[i].clientX; y += touches[i].clientY; }
            return {x: x / touches.length, y: y / touches.length};
        }

        // Bound directly rather than delegated: touchmove fires continuously
        // and has to be non-passive to preventDefault, which a delegated
        // listener on #content cannot be without killing the page's own scroll.
        function bindPad() {
            const pad = document.getElementById("pad");
            if (!pad) return;
            let last = null, startAt = 0, travel = 0, fingers = 0, dragging = false;

            const begin = (point, count) => {
                pad.classList.add("active");
                last = point;
                startAt = Date.now();
                travel = 0;
                fingers = count;
            };

            const drag = (point, count) => {
                if (!last) { last = point; return; }
                const dx = point.x - last.x, dy = point.y - last.y;
                last = point;
                travel += Math.abs(dx) + Math.abs(dy);
                if (count > fingers) fingers = count;
                // Two fingers scroll, and scrolling is inverted the way a
                // phone's own content is: dragging down shows what is above.
                if (count >= 2) queueScrollDelta(-dx, -dy);
                else queueMoveDelta(dx * POINTER_GAIN, dy * POINTER_GAIN);
                schedulePad();
            };

            const end = () => {
                pad.classList.remove("active");
                if (Date.now() - startAt < TAP_MS && travel < TAP_SLOP) {
                    buzz(5);
                    sendInput({op: "click", button: fingers >= 2 ? "right" : "left"});
                }
                last = null;
                fingers = 0;
            };

            pad.addEventListener("touchstart", (ev) => {
                ev.preventDefault();
                begin(centroid(ev.touches), ev.touches.length);
            }, {passive: false});

            pad.addEventListener("touchmove", (ev) => {
                ev.preventDefault();
                drag(centroid(ev.touches), ev.touches.length);
            }, {passive: false});

            pad.addEventListener("touchend", (ev) => {
                ev.preventDefault();
                if (ev.touches.length === 0) end();
            }, {passive: false});

            pad.addEventListener("touchcancel", () => { pad.classList.remove("active"); last = null; });

            // A mouse is the desktop browser case -- testing the remote from the
            // PC itself, and the odd laptop used as the remote.
            pad.addEventListener("mousedown", (ev) => {
                dragging = true;
                begin({x: ev.clientX, y: ev.clientY}, 1);
            });
            window.addEventListener("mousemove", (ev) => {
                if (dragging) drag({x: ev.clientX, y: ev.clientY}, 1);
            });
            window.addEventListener("mouseup", () => {
                if (!dragging) return;
                dragging = false;
                end();
            });
        }

        function queueMoveDelta(dx, dy) { padMove.dx += dx; padMove.dy += dy; }
        function queueScrollDelta(dx, dy) { padScroll.dx += dx; padScroll.dy += dy; }

        function extensionMissing() {
            return !!findTarget("system:extension");
        }

        // === Dictation ========================================================
        // The phone already has speech recognition and the microphone
        // permission; the PC already has a way to type into the focused
        // window. This is the wire between them, and it stays on the phone: no
        // audio is ever sent to the PC, only the text that came out of it.
        let recogniser = null;
        let dictating = false;
        let dictateNote = "";

        function speechSupported() {
            return typeof window.SpeechRecognition === "function" ||
                   typeof window.webkitSpeechRecognition === "function";
        }

        function paintDictateNote() {
            const note = document.getElementById("dictateNote");
            if (note) note.textContent = dictateNote;
            const button = document.getElementById("dictate");
            if (button) button.textContent = dictating ? "Stop" : "Dictate";
        }

        function toggleDictation() {
            if (dictating) { stopDictation(); return; }
            const Recogniser = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!Recogniser) return;

            recogniser = new Recogniser();
            recogniser.lang = navigator.language || "en-US";
            recogniser.interimResults = true;
            recogniser.continuous = true;

            recogniser.onresult = (ev) => {
                let finished = "";
                let pending = "";
                for (let i = ev.resultIndex; i < ev.results.length; i++) {
                    const text = ev.results[i][0].transcript;
                    if (ev.results[i].isFinal) finished += text;
                    else pending += text;
                }
                if (finished.trim()) {
                    // Sent as each phrase is recognised rather than at the end:
                    // the point is watching the words land on the PC.
                    const box = document.getElementById("typeBox");
                    typeDraft = (typeDraft ? typeDraft + " " : "") + finished.trim();
                    if (box) box.value = typeDraft;
                    sendInput({op: "type", text: finished});
                }
                dictateNote = pending.trim() ? "…" + pending.trim() : "Listening";
                paintDictateNote();
            };
            recogniser.onerror = (ev) => {
                dictating = false;
                dictateNote = ev.error === "not-allowed"
                    ? "The browser refused the microphone"
                    : `Dictation stopped: ${ev.error}`;
                paintDictateNote();
            };
            recogniser.onend = () => {
                dictating = false;
                if (dictateNote === "Listening" || dictateNote.startsWith("…")) dictateNote = "";
                paintDictateNote();
            };

            try {
                recogniser.start();
                dictating = true;
                dictateNote = "Listening";
            } catch (e) {
                dictateNote = "Could not start dictation";
            }
            paintDictateNote();
        }

        function stopDictation() {
            dictating = false;
            dictateNote = "";
            try { if (recogniser) recogniser.stop(); } catch (e) {}
            paintDictateNote();
        }

                '<button class="primary" id="typeSend">Send text</button>' +

                '<div class="keypad">' +

                '<button data-keys="f5">Start (F5)</button>' +
                '<button data-keys="page_down">Next ▶</button>' +
