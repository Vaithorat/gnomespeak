name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # dbus-python builds from source on the runner; the distro package the
      # README recommends is not visible to the runner's Python.
      - name: Install D-Bus build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libglib2.0-dev pkg-config

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,dbus]"

      - name: Lint with flake8
        run: |
          pip install flake8
          # Syntax errors and undefined names fail the build.
          flake8 vt tests --count --select=E9,F63,F7,F82 --show-source --statistics
          # Style is advisory.
          flake8 vt tests --count --exit-zero --max-complexity=12 --max-line-length=110 --statistics

      - name: Type-check with mypy
        run: |
          pip install mypy
          mypy vt --ignore-missing-imports
        continue-on-error: true

      - name: Run tests
        run: pytest -v

  test-without-dbus:
    # vt must degrade gracefully when python-dbus is absent rather than crash;
    # this job is what proves the fallback path still imports and serves.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package without the dbus extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Confirm dbus really is missing
        run: |
          python -c "import vt.server as s; assert not s.HAS_DBUS, 'dbus unexpectedly present'"

      - name: Run tests
        run: pytest -v
