name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. `vt ...`
        2. Open the phone UI and tap ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: "`vt doctor` output"
      description: Run `vt doctor` and paste the full output.
      render: text
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: GnomeSpeak version
      description: Output of `vt --version` (or `pip show gnomespeak`)
    validations:
      required: true

  - type: input
    id: distro
    attributes:
      label: Distro / desktop
      placeholder: e.g. Fedora 40, GNOME Shell 46, Wayland
    validations:
      required: true
